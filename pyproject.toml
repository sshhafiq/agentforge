[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "Durable AI agent workflows with Temporal-style orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shafiq Moltafet" }]
keywords = ["agents", "workflows", "durable-execution", "llm", "react"]
dependencies = ["click>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentforge = "agentforge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["agentforge*"]
